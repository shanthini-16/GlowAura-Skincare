# Render Blueprint for GlowAura
# Docs: https://render.com/docs/blueprint-spec

projects:
  - name: GlowAura
    environments:
      - name: production
        services:
          # 1. Flask Backend Web Service
          - type: web
            name: glowaura-backend
            runtime: python
            rootDir: backend
            plan: free
            buildCommand: pip install -r requirements.txt
            startCommand: gunicorn app:app
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.4
              - key: SECRET_KEY
                generateValue: true

          # 2. React Vite Frontend Static Site
          - type: web
            name: glowaura-frontend
            runtime: static
            rootDir: frontend
            buildCommand: npm install && npm run build
            staticPublishPath: dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_URL
                fromService:
                  type: web
                  name: glowaura-backend
                  envVarKey: RENDER_EXTERNAL_URL
